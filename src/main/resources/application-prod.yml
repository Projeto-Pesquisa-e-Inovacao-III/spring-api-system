server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 32MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT}

pag:
  url: ${PAG_API_URL}

infobip:
  base:
    url: ${INFOBIP_BASE_URL}
  api:
    key: ${INFOBIP_API_KEY}
  whatsapp:
    sender: ${INFOBIP_WHATSAPP_SENDER}
    template:
      name: ${INFOBIP_TEMPLATE_NAME}

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}

springdoc:
  swagger-ui:
    enabled: false

storage:
  type: ${STORAGE_TYPE}
  s3:
    bucket: ${AWS_S3_BUCKET}
    path: ${STORAGE_S3_PATH}

aws:
  region: ${AWS_REGION}
  s3:
    bucket: ${AWS_S3_BUCKET}
    endpoint: ${AWS_S3_ENDPOINT}
    path-style-access: ${AWS_S3_PATH_STYLE}

logging:
  level:
    root: info
    com.spring: info

init:
  email: ${INIT_EMAIL}
  password: ${INIT_PASSWORD}
