server:
  port: ${SERVER_PORT:8080}

spring:

  servlet:
    multipart:
      max-file-size: 4MB

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST}
    connection-timeout: 60000

pag:
  url: ${PAG_API_URL}

infobip:
  base:
    url: ${INFOBIP_BASE_URL:https://xk4qx3.api.infobip.com}
  api:
    key: ${INFOBIP_API_KEY}
  whatsapp:
    sender: ${INFOBIP_WHATSAPP_SENDER}
    template:
      name: ${INFOBIP_TEMPLATE_NAME:authentication}

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}

springdoc:
  swagger-ui:
    enabled: false

storage:
  local-dir: /app/imagens

logging:
  level:
    root: INFO
    com.spring: INFO

init:
  email: ${INIT_EMAIL}
  password: ${INIT_PASSWORD}

