spring:
  h2:
    console:
      enabled: true
      path: /h2-console


  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: always
      encoding: UTF-8
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: a
    password: a
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

pag:
  url: http://localhost:8081

infobip:
  base:
    url: https://xk4qx3.api.infobip.com
  api:
    key: a
  whatsapp:
    sender: a
    template:
      name: authentication

# Discord Webhook
discord:
  webhook:
    url: a

storage:
  local-dir: imagens
