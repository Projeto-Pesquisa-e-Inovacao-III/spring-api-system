  server:
    port: 8080

  spring:
    h2:
      console:
        enabled: true
        path: /h2-console

    datasource:
      url: jdbc:h2:mem:meubanco;DB_CLOSE_DELAY=-1
      driver-class-name: org.h2.Driver
      username: sa
      password: ""

    jpa:
      defer-datasource-initialization: true
      show-sql: true
      properties:
        hibernate:
          format_sql: true
      hibernate:
        ddl-auto: update

    sql:
      init:
        mode: always
        encoding: UTF-8

