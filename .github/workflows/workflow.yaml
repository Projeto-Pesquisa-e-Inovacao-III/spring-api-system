name: Continuous Integration

on:
  push:
    branches: [main, develop, feat/workflows]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give permission to mvnw
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-api-system:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-api-system:${{ github.sha }} .

      - name: Run container and smoke test
        run: |
          docker run -d --name spring-api-system -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/spring-api-system:latest
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Smoke test passed"
              exit 0
            fi

            if [ -z "$(docker ps -q -f name=spring-api-system -f status=running)" ]; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs spring-api-system || true
              exit 1
            fi

            sleep 2
          done

          echo "Smoke test timed out. Logs:"
          docker logs spring-api-system || true
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f spring-api-system || true
      
      - name: login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-api-system:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-api-system:${{ github.sha }}

