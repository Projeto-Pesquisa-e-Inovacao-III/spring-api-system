name: Continuous Integration

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  # Permite executar manualmente pela aba Actions
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/spring-api-system

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Give permission to mvnw
        run: chmod +x mvnw

      - name: Build and test
        env:
          SPRING_PROFILES_ACTIVE: test
          RABBITMQ_ENABLED: "false"
        run: ./mvnw clean verify

      # Build local rápido apenas para o Smoke Test
      - name: Build local Docker image (for smoke test)
        run: |
          docker build -t ${IMAGE_NAME}:latest .
          docker build -t ${IMAGE_NAME}:${{ github.sha }} .

      - name: Create CI Docker network
        run: docker network create ci-net

      - name: Start MySQL for smoke test
        run: |
          docker run -d --name mysql-ci --network ci-net \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=spring_api_system \
            mysql:8.0

      - name: Wait for MySQL
        run: |
          for i in {1..40}; do
            if docker exec mysql-ci mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time"
          docker logs mysql-ci || true
          exit 1

      - name: Run container and smoke test
        run: |
          docker run -d --name spring-api-system --network ci-net -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE="docker" \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://mysql-ci:3306/spring_api_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true" \
            -e SPRING_DATASOURCE_USERNAME="root" \
            -e SPRING_DATASOURCE_PASSWORD="root" \
            -e DDL_AUTO="update" \
            -e MAIL_HOST="sandbox.smtp.mailtrap.io" \
            -e MAIL_PORT="2525" \
            -e MAIL_USERNAME="ci" \
            -e MAIL_PASSWORD="ci" \
            -e PAG_API_URL="http://localhost:8081" \
            -e INFOBIP_BASE_URL="https://xk4qx3.api.infobip.com" \
            -e INFOBIP_API_KEY="ci" \
            -e INFOBIP_WHATSAPP_SENDER="ci" \
            -e INFOBIP_TEMPLATE_NAME="authentication" \
            -e DISCORD_WEBHOOK_URL="https://example.com/webhook" \
            -e RABBITMQ_AUTO_STARTUP="false" \
            -e RABBITMQ_ENABLED="false" \
            -e INIT_EMAIL="test@email.com" \
            -e INIT_PASSWORD="test" \
            ${IMAGE_NAME}:latest
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            if [ "$code" != "000" ]; then
              echo "Smoke test passed"
              exit 0
            fi

            if [ -z "$(docker ps -q -f name=spring-api-system -f status=running)" ]; then
              echo "Container stopped unexpectedly. Logs:"
              docker logs spring-api-system || true
              exit 1
            fi

            sleep 2
          done

          echo "Smoke test timed out. Logs:"
          docker logs spring-api-system || true
          exit 1

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f spring-api-system || true
          docker rm -f mysql-ci || true
          docker network rm ci-net || true

      # Após o sucesso no Smoke Test, prepara a imagem para a Azure (Multi-arch)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e publicação multi-arquitetura
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ============================================================
  # JOB AZURE - BACKEND 1
  # ============================================================
  deploy-azure-backend-1:
    name: Deploy Azure Backend 1
    needs: continuous-integration
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - backend
      - backend-1

    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Baixar imagem do backend 1
        run: |
          set -e
          sudo docker pull "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Parar container anterior do backend 1
        run: |
          sudo docker rm -f spring-api-system-1 || true

      - name: Iniciar backend 1
        run: |
          set -e
          sudo docker run -d \
            --name spring-api-system-1 \
            --restart unless-stopped \
            -p 8080:8080 \
            --env-file /home/ubuntu/backend-api-1/.env \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Verificar backend 1
        run: |
          set -e
          echo "Aguardando o Spring Boot iniciar..."
          sleep 20
          sudo docker ps --filter "name=spring-api-system-1"

          status_code=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            http://127.0.0.1:8080/actuator/health || true)

          if [ "$status_code" = "000" ]; then
            echo "Backend 1 não respondeu na porta 8080."
            sudo docker logs --tail 100 spring-api-system-1
            exit 1
          fi

          echo "Backend 1 respondeu com HTTP $status_code."

  # ============================================================
  # JOB AZURE - BACKEND 2
  # ============================================================
  deploy-azure-backend-2:
    name: Deploy Azure Backend 2
    needs: continuous-integration
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - backend
      - backend-2

    steps:
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Baixar imagem do backend 2
        run: |
          set -e
          sudo docker pull "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Parar container anterior do backend 2
        run: |
          sudo docker rm -f spring-api-system-2 || true

      - name: Iniciar backend 2
        run: |
          set -e
          sudo docker run -d \
            --name spring-api-system-2 \
            --restart unless-stopped \
            -p 8081:8081 \
            --env-file /home/ubuntu/backend-api-2/.env \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Verificar backend 2
        run: |
          set -e
          echo "Aguardando o Spring Boot iniciar..."
          sleep 20
          sudo docker ps --filter "name=spring-api-system-2"

          status_code=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            http://127.0.0.1:8081/actuator/health || true)

          if [ "$status_code" = "000" ]; then
            echo "Backend 2 não respondeu na porta 8081."
            sudo docker logs --tail 100 spring-api-system-2
            exit 1
          fi

          echo "Backend 2 respondeu com HTTP $status_code."